name: Build Geode Mod (Android)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      # Publish the .geode as a release asset so it can be downloaded directly on a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(find "${{ steps.build.outputs.build-output }}" -name '*.geode' | head -n 1)
          VERSION=$(jq -r '.version' mod.json 2>/dev/null || echo latest)
          gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$FILE" -R "$GITHUB_REPOSITORY" \
            --title "Path Builder $VERSION (latest build)" \
            --notes "Latest Android build of Path Builder. Download the .geode file below and put it in your Geode mods folder." \
            --target "$GITHUB_SHA"

permissions:
  contents: write
